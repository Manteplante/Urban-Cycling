name: ci-community

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Validate App And Pipeline Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Compile source tree
        run: uv run python -m compileall 01_scraper 03_processing 04_app

      - name: Enforce app gold-only guardrail
        run: uv run python 03_processing/ci/check_app_gold_only.py

      - name: Smoke import Streamlit app services
        run: |
          uv run python -c "import sys; sys.path.insert(0, '04_app'); import services.gold as g; import services.notebook_outputs as n; print('smoke-ok', len(g.available_years()), n.exports_exist())"

      - name: Validate remote gold endpoints
        run: uv run python 03_processing/ci/check_remote_gold_availability.py

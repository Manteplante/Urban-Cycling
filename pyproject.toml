[project]
name = "urban-cycling"
version = "0.1.0"
description = "Urban Cycling medallion pipeline and Streamlit app"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "folium>=0.18.0",
    "gcsfs>=2024.9.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
    "matplotlib>=3.10.0",
    "nbconvert>=7.16.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "scikit-learn>=1.5.0",
    "st-files-connection>=0.1.0",
    "streamlit>=1.40.0",
    "streamlit-folium>=0.23.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]
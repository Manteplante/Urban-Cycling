# Required for remote-only app loading when bucket is not in .env
GOLD_GCS_BUCKET = "your-bucket-name"
GOLD_GCS_PREFIX = ""
# Optional local debugging only. Keep false in production.
APP_DEBUG_GCS_ERRORS = "false"

[connections.gcs]
type = "service_account"
project_id = "xxx"
private_key_id = "xxx"
private_key = "xxx"
client_email = "xxx"
client_id = "xxx"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "xxx"

# Also supported by app runtime:
# [gcp_service_account]
# [gcs]
# or top-level service-account keys